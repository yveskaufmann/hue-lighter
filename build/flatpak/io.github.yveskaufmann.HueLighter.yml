app-id: io.github.yveskaufmann.HueLighter
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: hue-lighter

finish-args:
  # Hue bridge (HTTPS), bridge discovery via mDNS and discovery.meethue.com
  - --share=network
  # Tray icon (StatusNotifierItem). gogpu/systray owns org.kde.StatusNotifierItem-<pid>-<id>;
  # inside the sandbox hue-lighter always runs as PID 2, and the first tray gets id 2
  # (systray.New takes id 1 for the tray itself, the Linux backend id 2 for its bus name).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-2
  # API keys are stored via the Secret Service (go-keyring does not use the secret portal)
  - --talk-name=org.freedesktop.secrets

build-options:
  append-path: /usr/lib/sdk/golang/bin
  secret-env:
    - APP_VERSION
    - APP_COMMIT
  env:
    GOTOOLCHAIN: local
    CGO_ENABLED: "0"

modules:
  - name: hue-lighter
    buildsystem: simple
    build-commands:
      - |
        echo "📦 Building hue-lighter for flatpak with version $APP_VERSION and commit $APP_COMMIT"
        bash ./scripts/build.sh  \
          --version "${APP_VERSION}" \
          --commit "${APP_COMMIT}" \
          --use-go-mod-vendor \
          --os linux \
          --arch "${FLATPAK_ARCH}"
      - install -Dm755 bin/linux/hue-lighter /app/bin/hue-lighter
      - install -Dm644 build/flatpak/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 build/flatpak/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 build/flatpak/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      # Local checkout incl. the generated vendor/ dir and the embedded CA bundle, see `make flatpak`.
      - type: dir
        path: ../..
        skip:
          - bin
          - .git
          - .flatpak-builder
          - build/flatpak/build-dir
          - build/flatpak/.tmp-repo
