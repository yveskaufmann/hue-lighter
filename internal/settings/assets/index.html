<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hue Lighter Settings</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Hue Lighter Settings</h1>
      <p class="subtitle">Choose the lights to automate and your location for sunrise and sunset.</p>
    </header>

    <section aria-labelledby="lights-title">
      <h2 id="lights-title">Lights</h2>
      <p class="description">These lights are turned on at sunset and off at sunrise.</p>
      <ul id="selected-lights" class="boxed-list" aria-live="polite"></ul>

      <div class="search">
        <label for="light-search" class="visually-hidden">Search lights on your bridge</label>
        <input id="light-search" type="search" placeholder="Search lights on your bridge…" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
        <ul id="search-results" class="boxed-list popover" role="listbox" hidden></ul>
      </div>
      <p id="bridge-status" class="hint" hidden></p>
    </section>

    <section aria-labelledby="location-title">
      <h2 id="location-title">Location</h2>
      <p class="description">Used to calculate sunrise and sunset.</p>
      <div class="boxed-list">
        <label class="row">
          <span class="row-title">Latitude</span>
          <input id="latitude" type="number" step="any" min="-90" max="90" inputmode="decimal" required>
        </label>
        <label class="row">
          <span class="row-title">Longitude</span>
          <input id="longitude" type="number" step="any" min="-180" max="180" inputmode="decimal" required>
        </label>
        <div class="row">
          <span id="location-source" class="row-subtitle">Enter your coordinates or detect them.</span>
          <button id="detect-location" type="button">Detect my location</button>
        </div>
      </div>
    </section>

    <footer>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button id="save" type="button" class="suggested" disabled>Save</button>
    </footer>
  </main>
</body>
</html>
